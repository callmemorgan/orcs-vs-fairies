<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Practice coach browser proof</title>
    <style>
      html, body { margin: 0; min-height: 100%; color: #edf2ec; background: #14201e; font: 14px system-ui, sans-serif; }
      #game { position: fixed; inset: 0; }
      #coach-root { position: fixed; inset: 0; pointer-events: none; z-index: 25; }
      #fixture-info { position: fixed; right: 12px; top: 12px; width: 440px; max-height: 45vh; overflow: auto; z-index: 20; padding: 12px; background: #14201ef2; border: 1px solid #7f968a; }
      #fixture-info h1 { margin: 0 0 7px; font-size: 16px; }
      #fixture-info p { margin: 6px 0; }
      #fixture-info button { margin: 3px; padding: 6px; }
      #proof-status { white-space: pre-wrap; margin: 8px 0 0; font-size: 11px; }
      #proof-data { white-space: pre-wrap; font-size: 10px; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="coach-root"></div>
    <aside id="fixture-info" aria-label="Browser proof setup">
      <h1>Practice coach browser proof</h1>
      <p>A running local match with human Orcs and an AI Fairy opponent. Test controls pause or advance the normal simulation and set up owned assets. Advice receives only the permitted player observation.</p>
      <button id="freeze-fixture" type="button">Pause fixture match</button>
      <button id="resume-fixture" type="button">Resume fixture match</button>
      <button id="advance-1" type="button">Advance fixture by 1 second</button>
      <button id="advance-30" type="button">Advance fixture by 30 seconds</button>
      <button id="gather-fixture" type="button">Send fixture workers to visible wood</button>
      <button id="train-fixture" type="button">Queue fixture worker</button>
      <button id="build-fixture" type="button">Build fixture supply depot</button>
      <button id="supply-fixture" type="button">Prepare supply blocked fixture</button>
      <button id="bank-fixture" type="button">Prepare unused resource bank</button>
      <button id="army-fixture" type="button">Prepare separated owned army</button>
      <button id="privacy-fixture" type="button">Change hidden enemy and resource facts</button>
      <button id="remount-fixture" type="button">Remount fixture coach</button>
      <p id="fixture-notice" role="status"></p>
      <pre id="proof-status" aria-label="Simulation evidence"></pre>
      <details>
        <summary>Detailed simulation snapshot</summary>
        <pre id="proof-data" aria-label="Detailed simulation evidence"></pre>
      </details>
    </aside>
    <script type="module" src="./fixture.ts"></script>
  </body>
</html>
